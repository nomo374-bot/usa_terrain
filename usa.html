<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美國地理中英文代號學習與互動測驗</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* 左側地圖容器 */
        .map-container {
            position: relative;
            display: inline-block;
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .map-container img {
            display: block;
            max-width: 450px;
            height: auto;
            border-radius: 8px;
        }
        /* 右側控制面板 */
        .control-panel {
            flex: 1;
            min-width: 350px;
            max-width: 520px;
            background: #fff;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #e0e0e0;
            color: #555;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: #3498db;
            color: #fff;
        }
        /* 網格設定 */
        .btn-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .btn-grid.learn-layout {
            grid-template-columns: repeat(2, 1fr);
        }
        .btn-grid.quiz-layout {
            grid-template-columns: repeat(4, 1fr);
        }

        /* 按鈕設計 */
        .item-btn {
            padding: 10px;
            border: 1px solid #bdc3c7;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .badge-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background-color: rgba(231, 76, 60, 0.3);
            border: 2px solid rgba(231, 76, 60, 0.8);
            color: #c0392b;
            font-weight: bold;
            font-size: 15px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .item-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-grow: 1;
            padding-left: 8px;
        }
        .item-name-zh {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-name-en {
            font-size: 10px;
            color: #7f8c8d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-btn:hover:not(:disabled) .badge-circle {
            background-color: rgba(231, 76, 60, 0.7);
            color: white;
        }
        .item-btn:hover:not(:disabled) {
            background: #f1f2f6;
            border-color: #3498db;
        }
        .item-btn:disabled {
            background: #e4e7eb;
            border-color: #dcdde1;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .item-btn:disabled .badge-circle {
            background-color: rgba(149, 165, 166, 0.3);
            border-color: #bdc3c7;
            color: #95a5a6;
        }

        /* 測驗模式專用提示 */
        #quiz-box {
            background: #e8f4fd;
            border-left: 5px solid #3498db;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }
        .quiz-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        #quiz-question {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
        }
        #timer-display {
            font-size: 15px;
            font-weight: bold;
            color: #e74c3c;
            background: #fadbd8;
            padding: 2px 8px;
            border-radius: 6px;
        }
        #quiz-feedback {
            font-size: 15px;
            font-weight: bold;
            min-height: 25px;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ok-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 5px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .ok-btn:hover {
            background: #219653;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: #2c3e50;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .reset-container {
            margin-top: 20px;
            text-align: center;
        }
        .reset-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .reset-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <h1>美國地理中英文代號學習與互動測驗</h1>
    <p class="subtitle">學習模式自由探索；測驗模式每題 10 秒倒數，作答後需點擊 OK 進入下一題</p>

    <div class="main-container">
        <!-- 左側：美國地圖 -->
        <div class="map-container">
            <img src="https://o.quizlet.com/fQTgXL9msQWBW0eqRgcF8g.png" alt="美國地圖">
        </div>

        <!-- 右側：控制面板 -->
        <div class="control-panel">
            <div class="mode-switch">
                <button class="mode-btn active" id="modeLearn" onclick="switchMode('learn')">📖 學習模式</button>
                <button class="mode-btn" id="modeQuiz" onclick="switchMode('quiz')">🎯 測驗模式</button>
            </div>

            <!-- 測驗模式介面 -->
            <div id="quiz-box" style="display: none;">
                <div class="quiz-header-row">
                    <div id="quiz-question">準備開始測驗！</div>
                    <div id="timer-display">⏳ 10s</div>
                </div>
                <div id="quiz-feedback">
                    <span id="feedback-text">請點擊下方對應的代號按鈕</span>
                    <button id="okBtn" class="ok-btn" onclick="proceedToNextQuestion()">OK ➔</button>
                </div>
            </div>

            <div class="score-board" id="scoreBoard" style="display: none;">
                <span id="scoreText">得分：0 / 13</span>
                <span id="remainText">剩餘：13</span>
            </div>

            <!-- 按鈕網格容器 -->
            <div id="learning-panel">
                <div class="btn-grid learn-layout" id="all-buttons-grid"></div>
            </div>

            <div class="reset-container">
                <button class="reset-btn" onclick="resetGame()">🔄 重新開始 / 重置</button>
            </div>
        </div>
    </div>

    <script>
        const terrainData = [
            { id: "甲", nameZh: "北極海", nameEn: "Arctic Ocean" },
            { id: "乙", nameZh: "太平洋", nameEn: "Pacific Ocean" },
            { id: "丙", nameZh: "大西洋", nameEn: "Atlantic Ocean" },
            { id: "丁", nameZh: "哈德遜灣", nameEn: "Hudson Bay" },
            { id: "戊", nameZh: "墨西哥灣", nameEn: "Gulf of Mexico" },
            { id: "A", nameZh: "聖羅倫斯河", nameEn: "Saint Lawrence River" },
            { id: "B", nameZh: "密西西比河", nameEn: "Mississippi River" },
            { id: "ㄅ", nameZh: "洛磯山脈", nameEn: "Rocky Mountains" },
            { id: "ㄆ", nameZh: "阿帕拉契山脈", nameEn: "Appalachian Mountains" },
            { id: "ㄇ", nameZh: "拉不拉多高原", nameEn: "Labrador Plateau" },
            { id: "ㄈ", nameZh: "五大湖區", nameEn: "Great Lakes" },
            { id: "ㄉ", nameZh: "美國中部大平原", nameEn: "Great Plains / Central Lowlands" },
            { id: "ㄊ", nameZh: "格陵蘭", nameEn: "Greenland" }
        ];

        let currentMode = 'learn'; 
        let answeredItems = new Set(); 
        let quizQueue = [];
        let currentQuizItem = null;
        let score = 0;
        let timer = null;
        let timeLeft = 10;
        let isWaitingForOk = false;

        window.onload = function() {
            renderButtons();
        };

        function renderButtons() {
            const grid = document.getElementById('all-buttons-grid');
            grid.innerHTML = '';

            if (currentMode === 'learn') {
                grid.className = 'btn-grid learn-layout';
            } else {
                grid.className = 'btn-grid quiz-layout';
            }

            terrainData.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'item-btn';
                btn.id = `btn-${item.id}`;
                
                if (answeredItems.has(item.id)) {
                    btn.disabled = true;
                } else {
                    btn.disabled = false;
                }
                
                if (currentMode === 'learn') {
                    btn.innerHTML = `
                        <span class="badge-circle">${item.id}</span>
                        <div class="item-text">
                            <span class="item-name-zh">${item.nameZh}</span>
                            <span class="item-name-en">${item.nameEn}</span>
                        </div>
                    `;
                } else {
                    btn.innerHTML = `<span class="badge-circle">${item.id}</span>`;
                }
                
                btn.onclick = () => handleItemClick(item);
                grid.appendChild(btn);
            });
        }

        function handleItemClick(item) {
            if (isWaitingForOk || answeredItems.has(item.id)) return;

            if (currentMode === 'learn') {
                answeredItems.add(item.id);
                renderButtons();
            } else if (currentMode === 'quiz') {
                clearInterval(timer);
                isWaitingForOk = true;

                if (currentQuizItem && currentQuizItem.id === item.id) {
                    score++;
                    document.getElementById('feedback-text').innerHTML = `<span style="color: #27ae60;">🎉 答對了！代號是 ${item.id}</span>`;
                } else {
                    document.getElementById('feedback-text').innerHTML = `<span style="color: #c0392b;">❌ 答錯！正確代號是 ${currentQuizItem.id}</span>`;
                }

                answeredItems.add(currentQuizItem.id);
                updateScoreBoard();
                renderButtons();
                document.getElementById('okBtn').style.display = 'inline-block';
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('modeLearn').classList.toggle('active', mode === 'learn');
            document.getElementById('modeQuiz').classList.toggle('active', mode === 'quiz');

            const quizBox = document.getElementById('quiz-box');
            const scoreBoard = document.getElementById('scoreBoard');

            clearInterval(timer);

            if (mode === 'quiz') {
                quizBox.style.display = 'block';
                scoreBoard.style.display = 'flex';
                startQuiz();
            } else {
                quizBox.style.display = 'none';
                scoreBoard.style.display = 'none';
                renderButtons();
            }
        }

        function startQuiz() {
            resetGame(false);
            currentMode = 'quiz';
            document.getElementById('modeQuiz').classList.add('active');
            document.getElementById('modeLearn').classList.remove('active');
            
            quizBox.style.display = 'block';
            scoreBoard.style.display = 'flex';

            quizQueue = [...terrainData].sort(() => Math.random() - 0.5);
            score = 0;
            updateScoreBoard();
            renderButtons();
            nextQuizQuestion();
        }

        function nextQuizQuestion() {
            clearInterval(timer);
            isWaitingForOk = false;
            document.getElementById('okBtn').style.display = 'none';

            const remaining = quizQueue.filter(item => !answeredItems.has(item.id));
            
            if (remaining.length === 0) {
                document.getElementById('quiz-question').innerText = "🏆 太棒了！全部挑戰成功！";
                document.getElementById('timer-display').innerText = "完成";
                document.getElementById('feedback-text').innerHTML = `<span style="color: #27ae60; font-size: 16px;">恭喜你完美通關美國地理！</span>`;
                return;
            }

            currentQuizItem = remaining[0];
            document.getElementById('quiz-question').innerText = `請找出代號：【 ${currentQuizItem.nameZh} (${currentQuizItem.nameEn}) 】`;
            document.getElementById('feedback-text').innerText = "請點擊下方對應的代號按鈕";

            timeLeft = 10;
            document.getElementById('timer-display').innerText = `⏳ ${timeLeft}s`;
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `⏳ ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            if (isWaitingForOk) return;
            isWaitingForOk = true;

            answeredItems.add(currentQuizItem.id);
            document.getElementById('feedback-text').innerHTML = `<span style="color: #c0392b;">⏰ 時間到！正確代號是 ${currentQuizItem.id}</span>`;
            updateScoreBoard();
            renderButtons();
            document.getElementById('okBtn').style.display = 'inline-block';
        }

        function proceedToNextQuestion() {
            nextQuizQuestion();
        }

        function updateScoreBoard() {
            const total = terrainData.length;
            const remaining = total - answeredItems.size;
            document.getElementById('scoreText').innerText = `得分：${score} / ${total}`;
            document.getElementById('remainText').innerText = `剩餘：${remaining}`;
        }

        function resetGame(fullReset = true) {
            clearInterval(timer);
            answeredItems.clear();
            score = 0;
            isWaitingForOk = false;
            renderButtons();

            if (fullReset && currentMode === 'quiz') {
                switchMode('learn');
            } else if (currentMode === 'quiz') {
                quizQueue = [...terrainData].sort(() => Math.random() - 0.5);
                updateScoreBoard();
                nextQuizQuestion();
            }
        }
    </script>
</body>
</html>
